name: Debug Build

# 只手动触发：给没配签名 Secrets 的 fork 也能出一个可安装的 Debug APK
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Debug APK
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:assembleDebug

      - name: 整理 APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#apks[@]}）。"
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
